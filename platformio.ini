; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = p1am_200

[env]
platform = atmelsam@8.2.0
framework = arduino
lib_deps = 
	facts-engineering/P1AM @ ^1.0.9
lib_ldf_mode = deep+
monitor_speed = 115200
monitor_filters = send_on_enter, direct

[env:p1am_100]
board = p1am_100
platform_packages = 
	framework-arduino-samd @ https://github.com/facts-engineering/P1AMCore.git
build_flags = 
	-DP1AM_100
lib_deps = 

[env:p1am_200]
board = p1am_200
platform_packages = 
	framework-arduino-samd-adafruit @ https://github.com/facts-engineering/ArduinoCore-samd.git
lib_deps = 
	facts-engineering/P1AM @ ^1.0.9
	adafruit/Adafruit Zero DMA Library
build_flags = 
	-DP1AM_200
	-Werror=format
build_src_filter = 
	+<*>
	-<BringUp.cpp>

; Hardware check build: same rig, BringUp.cpp instead of main.cpp.
[env:p1am_200_bringup]
extends = env:p1am_200
build_src_filter = 
	+<*>
	-<main.cpp>

; Host-run unit tests for the machine and station logic. No hardware needed:
;   pio test -e native
[env:native]
platform = native
framework = 
lib_deps = 
lib_ldf_mode = chain
build_flags = 
	-std=gnu++11
	-I include
	-I test/stubs
build_src_filter = 
	+<machine/*>
test_framework = unity
test_build_src = yes
