; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = p1am_100, p1am_200

[env]
platform = atmelsam@8.2.0
framework = arduino
lib_deps = 
	facts-engineering/P1AM @ ^1.0.9
lib_ldf_mode = deep+
monitor_speed = 115200

[env:p1am_100]
board = p1am_100
platform_packages = 
	framework-arduino-samd @ https://github.com/facts-engineering/P1AMCore.git
build_flags = 
	-DP1AM_100
lib_deps = hideakitai/DebugLog@^0.8.4

[env:p1am_200]
board = p1am_200
platform_packages = 
	framework-arduino-samd-adafruit @ https://github.com/facts-engineering/ArduinoCore-samd.git
lib_deps = 
	facts-engineering/P1AM @ ^1.0.9
	adafruit/Adafruit Zero DMA Library
	hideakitai/DebugLog@^0.8.4
build_flags = 
	-DP1AM_200
